<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Minecraft Note Block Tool</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root{--mc-panel:#c6c6c6;--mc-btn:#8b8b8b;--mc-btn-dark:#373737;--mc-accent:#3c8527;--seek:#f00}
        *{ -webkit-tap-highlight-color: transparent; outline: none; }
        body{font-family:'DotGothic16',sans-serif;background:#1a1a1a;color:#fff;margin:0;overflow:hidden;display:flex;flex-direction:column;height:100vh}
        
        /* タップ時の白い半透明エフェクト */
        .setup-btn:active, .big-btn:active, .item-slot:active, .cell:active {
            background-color: rgba(255, 255, 255, 0.3) !important;
            transition: background 0.1s;
        }

        #setup-screen{position:fixed;inset:0;background:url('スタート画面背景.png')center/cover;z-index:2000;display:flex;align-items:center;justify-content:center;text-align:center}
        .setup-card{background:rgba(198,198,198,.95);padding:20px;border:4px solid #555;border-radius:4px;max-width:400px;width:85%;color:#333;box-shadow:15px 15px 0 rgba(0,0,0,.6);max-height:80vh;overflow-y:auto}
        .setup-btn{width:100%;padding:10px;margin:5px 0;cursor:pointer;border:3px solid #000;background:var(--mc-btn);color:#fff;font-family:'DotGothic16';display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:inset -4px -4px 0 var(--mc-btn-dark),inset 4px 4px 0 #bbb}
        .setup-btn img{width:30px;height:auto;border:1px solid #000}
        .github-btn{background:#4a4a4a!important;box-shadow:inset -3px -3px 0 #222,inset 3px 3px 0 #666!important}
        #version-info{position:absolute;bottom:10px;right:20px;font-size:28px;color:#fff;text-shadow:3px 3px 3px #000;pointer-events:none}

        #main-app{display:none;flex-direction:column;height:100vh}
        #top-bar{display:flex;align-items:center;gap:8px;padding:4px 10px;background:#000;border-bottom:2px solid #555;min-height:40px}
        .top-input{background:#333;color:#fff;border:1px solid #666;font-size:11px;padding:2px 5px;width:65px;font-family:monospace}
        .compact-play{width:32px;height:32px;background:#2980b9;border:2px solid #fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
        .compact-play img{width:22px;height:22px;image-rendering:pixelated}

        #board-container{flex-grow:1;overflow:auto;background:rgba(0,0,0,.2);position:relative;padding:10px}
        #board{display:grid;gap:2px;position:relative}
        #seek-line{position:absolute;top:0;left:0;width:4px;height:100%;background:var(--seek);box-shadow:0 0 10px var(--seek);z-index:100;pointer-events:none;display:none}
        .cell{width:50px;height:50px;background:#333;border:1px solid #444;display:flex;align-items:center;justify-content:center;cursor:pointer;box-sizing:border-box;position:relative}
        .cell img{width:80%;height:80%;image-rendering:pixelated;pointer-events:none}
        .cell.selected-cell{border:2px solid #fff;background:rgba(255,255,255,.1)}
        .pitch-label{position:absolute;bottom:1px;right:1px;font-size:8px;color:#fff;text-shadow:1px 1px 1px #000;pointer-events:none}
        .delay-label{position:absolute;bottom:1px;right:1px;font-size:8px;color:#ff0;text-shadow:1px 1px 1px #000;pointer-events:none}

        /* 下部パネル */
        #bottom-panel{background:var(--mc-panel);padding:6px;display:flex;border-top:4px solid #555;align-items:center;gap:6px;box-shadow:inset 0 3px 0 #fff;min-height:75px}
        
        /* スマホ版で横幅を制限するための設定 */
        body.is-mobile #bottom-panel { justify-content: space-between; }
        body.is-mobile #ctrl-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; flex-shrink: 0; }
        body.is-mobile .inventory-wrapper { flex-grow: 0; width: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; overflow: hidden; }

        .inventory-wrapper{display:flex;gap:4px;background:#8b8b8b;padding:4px;border:3px solid #373737;overflow-x:auto;flex-grow:1;height:65px;align-items:center;min-width:0}
        #ctrl-group{display:flex;gap:4px;flex-shrink:0}
        
        .big-btn{min-width:55px;max-width:60px;height:65px;background:#666;color:#fff;border:2px solid #000;cursor:pointer;font-size:8px;font-weight:bold;font-family:'DotGothic16';display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset -3px -3px 0 #333,inset 3px 3px 0 #999}
        .big-btn img{width:25px;height:25px;image-rendering:pixelated;margin-bottom:2px}
        .active-btn{background:var(--mc-accent)!important;box-shadow:inset -4px -4px 0 #1e4513,inset 4px 4px 0 #7ec468!important}

        .item-slot{min-width:50px;height:60px;background:#8b8b8b;border:2px solid #373737;cursor:pointer;font-size:7px;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 2px 2px 4px rgba(0,0,0,.3)}
        .item-slot img{width:24px;height:24px;margin-bottom:1px}
        .item-slot.selected{background:#aaa;border:2px solid #fff;box-shadow:0 0 8px #fff;z-index:5}

        #sub-menu{display:none;position:fixed;bottom:85px;left:10px;right:10px;background:var(--mc-panel);border:4px solid #555;padding:15px;z-index:3000;box-shadow:15px 15px 0 rgba(0,0,0,.5);overflow-y:auto;max-height:60vh}
        .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px}
    </style>
</head>
<body>
    <div id="setup-screen">
        <div class="setup-card">
            <div id="step-lang">
                <h2 style="margin:0">Language / 言語</h2>
                <button class="setup-btn" onclick="nextStep('mode','kanji')"><img src="日本国旗.png"> 日本語 (漢字)</button>
                <button class="setup-btn" onclick="nextStep('mode','kana')"><img src="日本国旗.png"> にほんご (ひらがな)</button>
                <button class="setup-btn" onclick="nextStep('mode','en')"><img src="アメリカ合衆国国旗.png"> English</button>
                <button class="setup-btn" onclick="nextStep('mode','zh')"><img src="中華人民共和国国旗.png"> 简体中文</button>
                <button class="setup-btn" onclick="nextStep('mode','fi')"><img src="フィンランド国旗.png"> Suomi</button>
                <button class="setup-btn" onclick="nextStep('mode','ru')"><img src="ロシア共和国連邦国旗.png"> Русский</button>
            </div>
            <div id="step-device" style="display:none">
                <h2 id="device-title">Device?</h2>
                <button class="setup-btn" onclick="finishSetup('pc')" id="btn-pc">PC</button>
                <button class="setup-btn" onclick="finishSetup('mobile')" id="btn-mobile">Smartphone</button>
            </div>
        </div>
        <div id="version-info">v1.0.0</div>
    </div>
    <div id="main-app">
        <div id="top-bar">
            <div id="pc-bg-area" style="display:none;align-items:center;gap:8px">
                <span style="font-size:11px">BG:</span>
                <input type="color" id="bg-picker" value="#222222" oninput="updPicker(this.value)">
                <input type="text" id="bg-code" class="top-input" value="#222222" onchange="updHex(this.value)">
                <button id="save-color-btn" onclick="saveColor()" style="font-size:10px;cursor:pointer;background:#555;color:#fff;border:1px solid #fff;padding:2px 5px"></button>
                <div id="saved-colors" style="display:flex;gap:3px"></div>
                <button id="btn-play-top" class="compact-play" onclick="togglePlay()"><img id="play-img-top" src="再生.png"></button>
            </div>
            <span id="alert-msg" style="color:#ff4;margin-left:10px;font-size:10px"></span>
        </div>
        <div id="board-container"><div id="board"><div id="seek-line"></div></div></div>
        <div id="sub-menu"><h3 id="menu-title" style="color:#000;margin:0">Menu</h3><div class="menu-grid" id="menu-grid"></div><button class="setup-btn" onclick="toggleSubMenu()" id="close-btn" style="background:#555;margin-top:15px">CLOSE</button></div>
        <div id="bottom-panel">
            <div id="inventory" class="inventory-wrapper"></div>
            <div id="ctrl-group"></div>
        </div>
    </div>
    <script>
        const GITHUB_URL = "https://github.com";
        let audioCtx,config={mode:'kanji',device:'pc'},cols=20,rows=5,layer=1,selKey="note",mobIdx=0,mapData=[],colors=[],mobItems=["note","repeater"],lastCell=null,playing=false,pTimer,tick=0;
        const uiText={
            kanji:{bg:"背景",l1:"1:回路",l2:"2:土台",addW:"+幅",addH:"+下",addH_up:"+上",save:"保存",load:"読込",alert:"置けません",device:"デバイスを選択",pc:"PC",mobile:"スマホ",rotate:"回転",close:"とじる",play:"再生",stop:"停止",colorSave:"色を保存",warn:"これは個人が制作したものです。正しく動作する保証はありません。",start:"始める",contact:"お問い合わせ・要望",note:"音ブロック",btn:"ボタン",powder:"RSパウダー",repeater:"リピーター",gold:"金ブロック",copper:"銅ブロック",emerald:"エメラルド",glow:"グロウストーン",eraser:"消しゴム"},
            kana:{bg:"はいけい",l1:"1:かいろ",l2:"2:どだい",addW:"+よこ",addH:"+した",addH_up:"+うえ",save:"ほぞん",load:"ひらく",alert:"おけません",device:"きかいをえらんでね",pc:"PC",mobile:"すまほ",rotate:"まわす",close:"とじる",play:"さいせい",stop:"とまる",colorSave:"いろをほぞん",warn:"これは こじんが つくったものです。ただしく うごく ほしょうは ありません。",start:"はじめる",contact:"おといあわせ・ようぼう",note:"おとぶろっく",btn:"ぼたん",powder:"RSぱうだー",repeater:"りぴーたー",gold:"きんぶろっく",copper:"どうぶろっく",emerald:"えめらるど",glow:"ぐろうすとーん",eraser:"けしごむ"},
            en:{bg:"BG",l1:"L1:Circuit",l2:"L2:Base",addW:"+Width",addH:"+Down",addH_up:"+Up",save:"Save",load:"Open",alert:"Can't Place",device:"Select Device",pc:"PC",mobile:"Smartphone",rotate:"Rotate",close:"CLOSE",play:"PLAY",stop:"STOP",colorSave:"Save Color",warn:"Individual project. No guarantee.",start:"START",contact:"Contact",note:"Note Block",btn:"Button",powder:"RS Dust",repeater:"Repeater",gold:"Gold Block",copper:"Copper Block",emerald:"Emerald",glow:"Glowstone",eraser:"Eraser"},
            zh:{bg:"背景",l1:"L1:电路",l2:"L2:方块",addW:"+宽度",addH:"+向下",addH_up:"+向上",save:"保存",load:"读取",alert:"无法放置",device:"选择设备",pc:"电脑",mobile:"手机",rotate:"旋转",close:"关闭",play:"播放",stop:"停止",colorSave:"保存颜色",warn:"个人作品。不保证正常运行。",start:"开始",contact:"联系",note:"音符盒",btn:"按钮",powder:"红石粉",repeater:"中继器",gold:"黄金块",copper:"铜块",emerald:"绿宝石",glow:"萤石",eraser:"橡皮擦"},
            fi:{bg:"Tausta",l1:"L1:Piiri",l2:"L2:Pohja",addW:"+Leveys",addH:"+Alas",addH_up:"+Ylös",save:"Tallenna",load:"Avaa",alert:"Ei voi asettaa",device:"Valitse laite",pc:"PC",mobile:"Älypuhelin",rotate:"Käännä",close:"SULJE",play:"SOITA",stop:"SEIS",colorSave:"Tallenna väri",warn:"Henkilökohtainen projekti. Ei takuuta.",start:"ALOITA",contact:"Yhteystiedot",note:"Nuottilohko",btn:"Nappi",powder:"RS-pöly",repeater:"Toistin",gold:"Kultalohko",copper:"Kuparilohko",emerald:"Smaragdi",glow:"Hehkukivi",eraser:"Pyyhekumi"},
            ru:{bg:"Фон",l1:"L1:Схема",l2:"L2:Основа",addW:"+Ширина",addH:"+Вниз",addH_up:"+Вверх",save:"Сохр.",load:"Открыть",alert:"Нельзя ставить",device:"Выберите устройство",pc:"ПК",mobile:"Смартフォン",rotate:"Повернуть",close:"ЗАКРЫТЬ",play:"ИГРАТЬ",stop:"СТОП",colorSave:"Цвет",warn:"Это личный проект. Гарантий нет.",start:"НАЧАТЬ",contact:"Контакт",note:"Нотныйブロック",btn:"Кнопка",powder:"Редстоун",repeater:"Повторитель",gold:"Золотой block",copper:"Медный block",emerald:"Изумруд",glow:"Светоカメン",eraser:"Ластик"}
        };
        const items={note:{img:"音ブロック.png",l:1,rot:0},btn:{img:"ボタン.png",l:1,rot:1},powder:{img:"レッドストーンパウダー1.png",l:1,rot:1},repeater:{img:"レッドストーンリピーター1.png",l:1,rot:1},gold:{img:"金ブロック.png",l:2,rot:0},copper:{img:"銅ブロック.png",l:2,rot:0},emerald:{img:"エメラルドブロック.png",l:2,rot:0},glow:{img:"グロウストーン.png",l:2,rot:0},eraser:{img:"消しゴム.png",l:0,rot:0}};
        function playNote(p){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=174.61*Math.pow(2,p/12);g.gain.setValueAtTime(0.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.5);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.5)}
        function nextStep(s,v){config[s]=v;document.getElementById('step-lang').style.display='none';document.getElementById('step-device').style.display='block';const t=uiText[v];document.getElementById('device-title').innerText=t.device;document.getElementById('btn-pc').innerText=t.pc;document.getElementById('btn-mobile').innerText=t.mobile}
        function finishSetup(d){config.device=d;if(d==='mobile')document.body.classList.add('is-mobile');const t=uiText[config.mode];document.getElementById('step-device').innerHTML=`<p style="font-size:14px;margin-bottom:20px;line-height:1.5">${t.warn}</p><button class="setup-btn" onclick="startGame()">${t.start}</button><button class="setup-btn github-btn" onclick="window.open(GITHUB_URL)">${t.contact}</button>`}
        function startGame(){document.getElementById('setup-screen').style.display='none';document.getElementById('main-app').style.display='flex';if(config.device==='mobile'){cols=10;rows=8;document.getElementById('top-bar').style.display='none'}else{document.getElementById('pc-bg-area').style.display='flex'}initData();updateUI();renderBoard()}
        function updateUI(){
            const t=uiText[config.mode],g=document.getElementById('ctrl-group'),pImg=playing?"停止.png":"再生.png",pL=playing?t.stop:t.play;
            document.getElementById('save-color-btn').innerText=t.colorSave;document.getElementById('close-btn').innerText=t.close;document.getElementById('menu-title').innerText=config.device==="pc"?t.note:"Menu";document.getElementById('play-img-top').src=pImg;
            let h=`<button class="big-btn ${layer===1?'active-btn':''}" onclick="setLayer(1)">${t.l1}</button><button class="big-btn ${layer===2?'active-btn':''}" onclick="setLayer(2)">${t.l2}</button>`;
            if(config.device==='pc'){h+=`<button class="big-btn" onclick="addCol()">${t.addW}</button><button class="big-btn" onclick="addRow()">${t.addH}</button><button class="big-btn" onclick="saveData()" style="background:#28a">${t.save}</button><button class="big-btn" onclick="document.getElementById('l-f').click()" style="background:#a82">${t.load}</button><input type="file" id="l-f" style="display:none" onchange="loadData(event)">`}
            else{h=`<button class="big-btn" onclick="togglePlay()"><img src="${pImg}"><span>${pL}</span></button>`+h;h+=`<button class="big-btn" onclick="rotateSel()" style="background:#d35"><span>${t.rotate}</span></button><button class="big-btn" onclick="toggleSubMenu('ctrl')"><span>…</span></button>`}
            h+=`<button class="big-btn github-btn" onclick="window.open(GITHUB_URL)"><span>${t.contact}</span></button>`;g.innerHTML=h;renderInv();
        }
        function togglePlay(){if(playing){clearTimeout(pTimer);playing=false;document.getElementById('seek-line').style.display='none'}else{playing=true;tick=0;document.getElementById('seek-line').style.display='block';playCycle()}updateUI()}
        function playCycle(){if(!playing)return;document.getElementById('seek-line').style.transform=`translateX(${tick*52}px)`;let w=200;mapData.forEach(r=>{const d=r[tick].t;if(d.id==='note')playNote(d.p);if(d.id==='repeater')w=d.d*100});tick=(tick+1)%cols;pTimer=setTimeout(playCycle,w)}
        function updPicker(v){document.getElementById('bg-code').value=v.toUpperCase();changeBG(v)}
        function updHex(v){if(/^#[0-9A-F]{6}$/i.test(v)){document.getElementById('bg-picker').value=v;changeBG(v)}}
        function changeBG(c){document.body.style.backgroundColor=c;const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16),br=(r*299+g*587+b*114)/1000;document.documentElement.style.setProperty('--seek',br>125?"#f00":"#0ff")}
        function saveColor(){const c=document.getElementById('bg-picker').value;if(!colors.includes(c)){colors.push(c);const s=document.createElement('div');s.className='swatch';s.style.backgroundColor=c;s.onclick=()=>{document.getElementById('bg-picker').value=c;updPicker(c)};document.getElementById('saved-colors').appendChild(s)}}
        function renderInv(){
            const v=document.getElementById('inventory');v.innerHTML="";const its=config.device==='pc'?Object.keys(items):mobItems;
            its.forEach((k,i)=>{const s=document.createElement('div');s.className='item-slot'+(config.device==='pc'?(k===selKey?' selected':''):(i===mobIdx?' selected':''));s.innerHTML=`<img src="${items[k].img}"><span>${uiText[config.mode][k]}</span>`;s.onclick=()=>{if(config.device==='pc'){selKey=k}else{mobIdx=i;selKey=mobItems[i]}renderInv()};v.appendChild(s)});
            if(config.device==='mobile'){const m=document.createElement('div');m.className='item-slot';m.innerHTML='<span style="font-size:24px">…</span>';m.onclick=()=>toggleSubMenu('item');v.appendChild(m)}
        }
        function initData(){mapData=Array.from({length:rows},()=>Array.from({length:cols},()=>({t:{id:"",r:0,p:0,d:1},b:{id:"",r:0}})))}
        function renderBoard(){
            const b=document.getElementById('board');b.innerHTML="";b.style.gridTemplateColumns=`repeat(${cols},50px)`;
            mapData.forEach((row,r)=>row.forEach((d,c)=>{
                const el=document.createElement('div');el.className='cell'+(lastCell&&lastCell.r===r&&lastCell.c===c?' selected-cell':'');const ld=layer===1?d.t:d.b;
                if(ld.id){const img=document.createElement('img');img.src=items[ld.id].img;img.style.transform=`rotate(${ld.r}deg)`;el.appendChild(img);
                if(ld.id==='note'){const lbl=document.createElement('span');lbl.className='pitch-label';lbl.innerText=ld.p;el.appendChild(lbl)}
                if(ld.id==='repeater'){const lbl=document.createElement('span');lbl.className='delay-label';lbl.innerText=ld.d;el.appendChild(lbl)}}
                el.onclick=()=>{lastCell={r,c};if(selKey==='eraser'){ld.id="";}else if(ld.id==='note'&&selKey==='note'){ld.p=(ld.p+1)%25;playNote(ld.p)}else if(ld.id==='repeater'&&selKey==='repeater'){ld.d=(ld.d%4)+1}else{const info=items[selKey];if(info.l!==layer&&info.l!==0){document.getElementById('alert-msg').innerText=uiText[config.mode].alert;setTimeout(()=>document.getElementById('alert-msg').innerText="",2000);return}ld.id=selKey;if(selKey==='note'){ld.p=0;playNote(0)}if(selKey==='repeater'){ld.d=1}}renderBoard()};b.appendChild(el);
            }));
        }
        function addCol(){cols++;mapData.forEach(r=>r.push({t:{id:"",r:0,p:0,d:1},b:{id:"",r:0}}));renderBoard()}
        function addRow(){rows++;const nr=Array(cols).fill(0).map(()=>({t:{id:"",r:0,p:0,d:1},b:{id:"",r:0}}));if(config.device==='mobile')mapData.unshift(nr);else mapData.push(nr);renderBoard()}
        function setLayer(l){layer=l;updateUI();renderBoard()}
        function rotateSel(){if(!lastCell)return;const ld=layer===1?mapData[lastCell.r][lastCell.c].t:mapData[lastCell.r][lastCell.c].b;if(ld.id&&items[ld.id].rot){ld.r=(ld.r+90)%360;renderBoard()}}
        function toggleSubMenu(t){const m=document.getElementById('sub-menu');if(m.style.display==='block')m.style.display='none';else{m.style.display='block';const g=document.getElementById('menu-grid');g.innerHTML="";if(t==='item'){Object.keys(items).forEach(k=>{const d=document.createElement('div');d.className='menu-item';d.innerHTML=`<img src="${items[k].img}" width="30"><div>${uiText[config.mode][k]}</div>`;d.onclick=()=>{if(config.device==='mobile')mobItems[mobIdx]=k;selKey=k;toggleSubMenu();renderInv()};g.appendChild(d)})}else{const btns=[{n:uiText[config.mode].addW,f:addCol},{n:config.device==='mobile'?uiText[config.mode].addH_up:uiText[config.mode].addH,f:addRow},{n:uiText[config.mode].save,f:saveData,c:'#28a'},{n:uiText[config.mode].load,f:()=>document.getElementById('l-f').click(),c:'#a82'}];btns.forEach(x=>{const btn=document.createElement('button');btn.className='big-btn';btn.style.background=x.c||'#666';btn.style.width='100%';btn.innerText=x.n;btn.onclick=()=>{x.f();toggleSubMenu()};g.appendChild(btn)})}}}
        function saveData(){const n=prompt("Name:","score");if(n){const b=new Blob([JSON.stringify({cols,rows,mapData,colors})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n+'.json';a.click()}}
        function loadData(e){const r=new FileReader();r.onload=ev=>{const d=JSON.parse(ev.target.result);cols=d.cols;rows=d.rows;mapData=d.mapData;colors=d.colors||[];renderBoard()};r.readAsText(e.target.files)}
    </script>
</body>
</html>
